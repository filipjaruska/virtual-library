name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  frontend:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # No NEXT_PUBLIC_STRAPI_URL is set, so this builds against the bundled
      # collection — the same path the deployed site takes.
      - run: npm run build
